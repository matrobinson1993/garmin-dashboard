<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garmin Dashboard</title>
<meta name="theme-color" content="#0b7a75">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Garmin">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14181f;--mut:#667085;--line:#e4e7ec;--acc:#0b7a75;--acc2:#e0f2f1;--warn:#b54708}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#171b21;--ink:#e8eaed;--mut:#98a2b3;--line:#2a3039;--acc:#3cc4bd;--acc2:#12332f}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:20px 24px 8px;display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
h1{font-size:22px;margin:0}h2{font-size:15px;margin:0 0 12px}.mut{color:var(--mut)}
nav{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;background:none;color:var(--mut);padding:10px 14px;font:inherit;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--acc);font-weight:600}
main{padding:20px 24px;max-width:1300px;margin:auto}section{display:none}section.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.tile span{color:var(--mut);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
select,input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.seg button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--mut);padding:5px 10px;cursor:pointer}
.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}.seg button+button{border-left:0}
.seg button.on{background:var(--acc2);color:var(--ink)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card)}
td.n,th.n{text-align:right}tbody tr{cursor:pointer}tbody tr:hover{background:var(--acc2)}
.tw{max-height:70vh;overflow:auto}
svg{display:block;width:100%;overflow:visible}svg text{fill:var(--mut);font-size:11px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 8px;border-radius:6px;font-size:12px;display:none;z-index:9}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}
.charts .card{margin:0}dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:640px;width:92vw}
dialog::backdrop{background:#0006}dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:0}dt{color:var(--mut)}dd{margin:0}
a{color:var(--acc)}.pill{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--acc2);font-size:12px}
.empty{padding:40px;text-align:center;color:var(--mut)}
@media (max-width:600px){.charts{grid-template-columns:1fr}main,header{padding-left:12px;padding-right:12px}nav{padding:0 4px}h1{font-size:19px}.grid{grid-template-columns:repeat(2,1fr)}.tile b{font-size:19px}}
svg{touch-action:pan-y}
#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
#lock form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;width:100%;max-width:380px}
#lock h1{margin-bottom:6px}#lock input[type=password]{width:100%;padding:12px;font-size:16px;margin:14px 0 10px}
#lock button,.btn{width:100%;padding:12px;font:inherit;font-weight:600;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer}
#lock label{display:flex;gap:8px;align-items:center;color:var(--mut);margin-bottom:14px}#lockErr{color:var(--warn);min-height:20px;margin:8px 0 0}
.links a{display:inline-block;margin:0 14px 8px 0}
#dlg{padding:16px}#dlg table{font-size:13px}#dlg td,#dlg th{padding:6px 4px}#dlg td:first-child{white-space:normal}#dlg .chip{font-size:11px;padding:1px 7px}
@media (max-width:600px){#dlg{width:96vw;max-width:96vw;padding:14px}}
.tcard{cursor:pointer;transition:border-color .15s}.tcard:hover{border-color:var(--acc)}
.tcard h2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:4px}.tcard .more{margin-left:auto;color:var(--acc);font-size:13px;font-weight:500}
.tline{font-size:13px;color:var(--mut);margin:0 0 10px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.chip.good{background:#dcfae6;color:#067647}.chip.bad{background:#fef0c7;color:#b54708}.chip.neu{background:var(--acc2);color:var(--mut)}
@media (prefers-color-scheme:dark){.chip.good{background:#053321;color:#75e0a7}.chip.bad{background:#4e1d09;color:#fec84b}}
#trend{padding:0;max-width:760px;width:100%;border:0}
#trend .th{position:sticky;top:0;z-index:2;background:var(--card);display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
#trend .th h2{margin:0;font-size:17px;flex:1}#trend .x{font:inherit;font-size:20px;border:0;background:none;color:var(--ink);cursor:pointer;padding:4px 8px}
#trend .tb{padding:16px}#trend .sum p{margin:0 0 10px;line-height:1.5}#trend .sum .about{color:var(--mut);font-size:13px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
#trend .grid{grid-template-columns:repeat(4,1fr);margin:14px 0}
@media (max-width:600px){#trend{max-width:100vw;max-height:100dvh;height:100dvh;margin:0;border-radius:0}#trend .grid{grid-template-columns:repeat(2,1fr)}}
.exp{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.dl{font:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);cursor:pointer}
.dl::before{content:'⬇ ';color:var(--acc)}.dl:active{background:var(--acc2)}
</style>
</head>
<body>
<div id="lock"><form id="lockForm"><h1>Garmin Dashboard</h1><div class="mut">Enter your data passphrase to open your data. It is decrypted on this device only.</div>
<input type="password" id="pass" autocomplete="current-password" placeholder="Passphrase" required>
<label><input type="checkbox" id="remember"> Remember on this device</label>
<button id="unlockBtn">Unlock</button><p id="lockErr"></p><p class="mut" style="font-size:13px;margin:4px 0 0">Not yours? <a href="setup.html">Set up your own Garmin Dashboard →</a></p></form></div>
<header><div><h1 id="title">My Garmin Data</h1><div class="mut" id="sub"></div></div>
<div class="seg" id="range"><button data-d="30">30d</button><button data-d="90">90d</button><button data-d="365" class="on">1y</button><button data-d="0">All</button></div></header>
<nav id="tabs"><button data-t="overview" class="on">Overview</button><button data-t="health">Health trends</button><button data-t="sleep">Sleep</button><button data-t="activities">Activities</button><button data-t="more">More</button></nav>
<main>
<section id="overview" class="on"></section>
<section id="health"></section>
<section id="sleep"></section>
<section id="activities"></section>
<section id="more"></section>
</main>
<div class="tip" id="tip"></div>
<dialog id="trend"><div class="th"><button class="x" onclick="closeTrend()" aria-label="Back">←</button><h2 id="trTitle"></h2><span id="trChip"></span></div><div class="tb" id="trBody"></div></dialog>
<dialog id="dlg"><div id="dlgBody"></div><p style="text-align:right;margin:12px 0 0"><button onclick="dlg.close()">Close</button></p></dialog>
<script>
let G = null;
const $ = s => document.querySelector(s);
const tip = $('#tip');
let RANGE = 365;
const fmt = (v, d=0) => v==null||isNaN(v) ? '–' : Number(v).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d});
const hms = s => { if(!s) return '–'; s=Math.round(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0'); };
const label = t => (t||'other').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cutoff = () => { if(!RANGE) return '0000'; const d=new Date(); d.setDate(d.getDate()-RANGE); return d.toISOString().slice(0,10); };
const inRange = arr => arr.filter(r => (r.d||r.start||'') >= cutoff());
const avg = a => { a=a.filter(v=>v!=null); return a.length ? a.reduce((x,y)=>x+y,0)/a.length : null; };
const sum = a => a.reduce((x,y)=>x+(y||0),0);
function pace(a){ if(!a.speed||!a.km) return '–'; if(/swim/.test(a.type||'')){ const s=100/a.speed; return Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0')+' /100m'; } if(/run|walk|hik/.test(a.type||'')){ const s=1000/a.speed; return Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0')+' /km'; } return fmt(a.speed*3.6,1)+' km/h'; }

// ---- simple SVG chart --------------------------------------------------
function chart(el, rows, key, o={}) {
  const pts = rows.filter(r => r[key]!=null).map(r => ({d:r.d, v:r[key]}));
  if (!pts.length) { el.innerHTML = '<div class="empty">No data in this range</div>'; return; }
  const W=Math.max(300, Math.min(700, el.clientWidth||600)), H=o.h||180, L=40, R=8, T=10, B=22;
  const t0=+new Date(pts[0].d), t1=+new Date(pts[pts.length-1].d)||t0+1, span=Math.max(t1-t0, 864e5);
  let lo=o.min??Math.min(...pts.map(p=>p.v)), hi=Math.max(...pts.map(p=>p.v), o.goal||-Infinity);
  if (o.bar) lo=0; if (hi===lo){hi+=1;lo-=1;} const pad=(hi-lo)*.08; if(!o.bar&&o.min==null) lo-=pad; hi+=pad;
  const x = d => L+(W-L-R)*((+new Date(d))-t0)/span, y = v => T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let s = `<svg viewBox="0 0 ${W} ${H}">`;
  for (let i=0;i<=3;i++){ const v=lo+(hi-lo)*i/3, yy=y(v); s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L-6}" y="${yy+4}" text-anchor="end">${o.fmtv?o.fmtv(v,true):fmt(v, Math.abs(hi-lo)<10?1:0)}</text>`; }
  const ticks=5; for(let i=0;i<=ticks;i++){ const t=new Date(t0+span*i/ticks); s+=`<text x="${L+(W-L-R)*i/ticks}" y="${H-4}" text-anchor="middle">${t.toLocaleDateString(undefined,{month:'short',year:span>2e10?'2-digit':undefined,day:span>2e10?undefined:'numeric'})}</text>`; }
  if (o.goal) s+=`<line x1="${L}" x2="${W-R}" y1="${y(o.goal)}" y2="${y(o.goal)}" stroke="var(--warn)" stroke-dasharray="4 4"/>`;
  const col = o.color||'var(--acc)';
  if (o.bar) { const bw=Math.max(1,(W-L-R)/(span/864e5)*.75); pts.forEach(p=>s+=`<rect x="${x(p.d)-bw/2}" y="${y(p.v)}" width="${bw}" height="${y(lo)-y(p.v)}" fill="${col}" opacity=".75"/>`); }
  else {
    s+=`<polyline fill="none" stroke="${col}" stroke-width="1.2" opacity="${pts.length>60?.35:1}" points="${pts.map(p=>x(p.d)+','+y(p.v)).join(' ')}"/>`;
    if (pts.length>60) { const k=7, ma=pts.map((p,i)=>{const w=pts.slice(Math.max(0,i-k+1),i+1);return x(p.d)+','+y(avg(w.map(q=>q.v)));}); s+=`<polyline fill="none" stroke="${col}" stroke-width="2" points="${ma.join(' ')}"/>`; }
  }
  s+=`<line class="hx" y1="${T}" y2="${H-B}" stroke="var(--mut)" opacity="0"/><rect x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent"/></svg>`;
  el.innerHTML = s;
  const svg=el.querySelector('svg'), hx=svg.querySelector('.hx');
  svg.onpointermove = svg.onpointerdown = e => { const b=svg.getBoundingClientRect(), px=(e.clientX-b.left)/b.width*W, t=t0+(px-L)/(W-L-R)*span;
    let best=pts[0]; for(const p of pts) if(Math.abs(+new Date(p.d)-t)<Math.abs(+new Date(best.d)-t)) best=p;
    hx.setAttribute('x1',x(best.d)); hx.setAttribute('x2',x(best.d)); hx.setAttribute('opacity',.6);
    tip.style.display='block'; tip.style.left=(e.clientX+12)+'px'; tip.style.top=(e.clientY-28)+'px';
    tip.textContent=`${best.d}: ${o.fmtv?o.fmtv(best.v):fmt(best.v, o.dec??0)+(o.unit||'')}`; };
  svg.onpointerleave = () => { tip.style.display='none'; hx.setAttribute('opacity',0); };
}
// ---- trend analysis ---------------------------------------------------------
// better: 'up' = higher is better, 'down' = lower is better, 'neutral' = no judgement, [lo,hi] = target range
const METRICS = {
  rhr:{better:'down', about:'Resting heart rate. A lower resting heart rate usually reflects a fitter heart. A rise of 5+ bpm above your normal for several days is often linked to illness, poor sleep, stress, alcohol or overtraining.'},
  hrv:{better:'up', about:'Overnight heart rate variability. Compare it with your own baseline, not other people’s. Higher than your normal usually means good recovery; a drop below it often follows hard training, stress, illness, alcohol or short sleep. It naturally declines slowly with age.'},
  stress:{better:'down', about:'Garmin’s all-day stress score (0–100) is based on heart rate variability, so it rises with physical strain, illness and poor recovery as well as mental stress. Under 25 is rest; 26–50 is low.'},
  bbHigh:{better:'up', about:'The highest Body Battery reached each day, usually after sleep. A higher peak means you are starting the day better recharged.'},
  readiness:{better:'up', about:'Training readiness combines sleep, recovery time, HRV, acute training load and stress. Low readiness for a few days is normal after hard blocks; a long run of low scores suggests you need more recovery.'},
  vo2:{better:'up', about:'VO₂ max is Garmin’s estimate of your aerobic fitness. It moves slowly: a change of 1–2 points over a few months is meaningful.'},
  kg:{better:'neutral', about:'Body weight from your scale or manual entries. Whether up or down is “good” depends on your goals, so no judgement is made.'},
  intensity:{better:'up', about:'Intensity minutes (vigorous minutes count double). Health guidelines suggest at least 150 a week, about 21 a day.'},
  activeKcal:{better:'up', about:'Calories burned through activity on top of your resting metabolism.'},
  floors:{better:'up', about:'Floors climbed, counted from your watch’s barometer.'},
  spo2:{better:'neutral', about:'Average blood oxygen. Readings of about 95–100% are typical at sea level; wrist readings are noisy and drop at altitude.'},
  resp:{better:'neutral', about:'Average breathing rate while awake. 12–20 breaths a minute is typical; a sustained change from your own normal can accompany illness.'},
  steps:{better:'up', about:'Daily steps. Studies link more daily steps to lower health risk, with most of the benefit up to about 8,000–10,000 a day.'},
  weeklyKm:{better:'up', about:'Total distance from all recorded activities each week (Monday start).'},
  sleepH:{better:[7,9], about:'Total sleep time. Most adults need 7–9 hours a night.'},
  sleepScore:{better:'up', about:'Garmin’s 0–100 sleep score: 90+ excellent, 80–89 good, 60–79 fair, under 60 poor.'},
  deepH:{better:'up', about:'Deep sleep is the most physically restorative stage. It typically makes up about 13–23% of the night.'},
  actKm:{better:'neutral', about:'Distance of each activity. Longer isn’t automatically better, so no judgement is made; see weekly distance for your overall volume.'},
  actMin:{better:'neutral', about:'Duration of each activity.'},
  wkKm:{better:'up', about:'Total distance for this activity type each week (Monday start). Steady increases of no more than about 10% a week are a common rule of thumb to limit injury risk.'},
  wkH:{better:'up', about:'Total time spent on this activity type each week.'},
  pace:{better:'down', about:'Average pace (minutes per km). Faster isn’t always the goal of every session — easy runs should feel easy — so read it alongside heart rate and efficiency.'},
  pace100:{better:'down', about:'Average swim pace per 100 m.'},
  kmh:{better:'up', about:'Average speed. Terrain, wind and the type of session have a big effect, so look at the long-term direction.'},
  eff:{better:'up', about:'Efficiency: metres covered per heartbeat (speed ÷ heart rate). If it rises, you’re going further for the same heart rate — one of the clearest signs of improving aerobic fitness. Heat, hills and fatigue lower it.'},
  avgHr:{better:'neutral', about:'Average heart rate during the activity. Whether higher or lower is good depends on the session — compare it with pace (see efficiency).'},
  maxHr:{better:'neutral', about:'Highest heart rate reached during the activity.'},
  te:{better:'neutral', about:'Aerobic training effect (0–5): how much the session improved your aerobic base. 2–2.9 maintains, 3–3.9 improves, 4–4.9 highly improves, 5 is overreaching. A mix of easy and harder sessions works best.'},
  ate:{better:'neutral', about:'Anaerobic training effect (0–5): how much the session built speed and power through high-intensity efforts.'},
  tl:{better:'neutral', about:'Training load: Garmin’s estimate of how hard the session was on your body (EPOC). Big jumps in weekly load raise injury and illness risk.'},
  elev:{better:'neutral', about:'Total elevation gained during the activity.'},
  cad:{better:'neutral', about:'Average cadence (steps or pedal strokes per minute). For running, slightly higher cadence often means a shorter, more efficient stride.'},
  power:{better:'up', about:'Average power in watts.'},
  kcal:{better:'neutral', about:'Calories burned during the activity.'},
  stride:{better:'neutral', about:'Average stride length while running.'},
  gct:{better:'down', about:'Ground contact time: how long each foot stays on the ground. Lower usually means a more efficient running stride.'},
  remH:{better:'up', about:'REM sleep supports memory and mood. It typically makes up about 20–25% of the night.'},
};
const DAY = 864e5;
function seriesOf(rows, key){ return rows.filter(r=>r[key]!=null&&r.d).map(r=>({t:+new Date(r.d), d:r.d, v:r[key]})).sort((a,b)=>a.t-b.t); }
const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const sd = a => { const m=mean(a); return a.length>1 ? Math.sqrt(mean(a.map(x=>(x-m)**2))) : 0; };
function windowAvg(pts, endT, days){ return mean(pts.filter(p=>p.t>endT-days*DAY && p.t<=endT).map(p=>p.v)); }
function regress(pts){
  if (pts.length < 6) return null;
  const t0=pts[0].t, xs=pts.map(p=>(p.t-t0)/DAY), ys=pts.map(p=>p.v), mx=mean(xs), my=mean(ys);
  let num=0, den=0; xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my); den+=(x-mx)**2;});
  const slope=den?num/den:0, span=xs[xs.length-1]; const start=my-slope*mx, end=start+slope*span;
  return {start, end, change:end-start, rel:(end-start)/(sd(ys)||1), span};
}
function judge(key, pts){
  const meta=METRICS[key]||{better:'neutral'}, r=regress(pts);
  if (!r) return {cls:'neu', text:'Not enough data', dir:0, r};
  const dir = Math.abs(r.rel) < 0.35 ? 0 : Math.sign(r.change);
  if (Array.isArray(meta.better)) {
    const [lo,hi]=meta.better, dist=v=>v<lo?lo-v:v>hi?v-hi:0, ds=dist(r.start), de=dist(r.end);
    if (de===0 && ds===0) return {cls:'good', text:'In healthy range', dir, r};
    if (Math.abs(de-ds) < 0.1) return {cls:de?'bad':'good', text:de?'Below target':'In healthy range', dir, r};
    return de<ds ? {cls:'good', text:'Improving', dir, r} : {cls:'bad', text:'Worsening', dir, r};
  }
  if (!dir) return {cls:'neu', text:'Stable', dir, r};
  if (meta.better==='neutral') return {cls:'neu', text:dir>0?'Rising':'Falling', dir, r};
  const good = (dir>0) === (meta.better==='up');
  return {cls:good?'good':'bad', text:good?'Improving':'Worsening', dir, r};
}
const chipHTML = j => `<span class="chip ${j.cls}">${j.dir>0?'↗ ':j.dir<0?'↘ ':''}${j.text}</span>`;
const RANGE_WORDS = {30:'the last 30 days', 90:'the last 90 days', 365:'the last year', 0:'all your history'};
const monthName = d => new Date(d).toLocaleDateString(undefined,{month:'short', year:'numeric'});
function cmpWord(a, b, dec, unit, label, F=fmt){
  const diff=a-b, eps=Math.max(Math.abs(b)*0.01, dec?0.05:0.5);
  if (Math.abs(diff) < eps) return `about the same as ${label} (${F(b,dec)}${unit})`;
  return `${diff>0?'up':'down'} ${F(Math.abs(diff),dec)}${unit} on ${label} (${F(b,dec)}${unit})`;
}
function trendSummary(key, allPts, rangePts, o, range){
  const F=o.fmtv?(v=>o.fmtv(v)):fmt, unit=o.fmtv?'':(o.unit||''), meta=METRICS[key]||{better:'neutral'}, j=judge(key, rangePts), out=[], per=o.per||'';
  if (!allPts.length) return {j, html:'<p>No data yet.</p>', short:''};
  const endT=allPts[allPts.length-1].t;
  // small numbers get one extra decimal so comparisons read consistently
  const dec=(o.dec??0)+((o.dec??0)===0 && Math.abs(allPts[allPts.length-1].v)<300 ? 1 : 0);
  // 1. direction over the selected range
  if (j.r) {
    const verb = j.dir===0 ? `has held steady at about ${F((j.r.start+j.r.end)/2,dec)}${unit}` : `has ${j.dir>0?'risen':'fallen'} from about ${F(j.r.start,dec)}${unit} to ${F(j.r.end,dec)}${unit}`;
    const tone = j.cls==='good'&&j.dir ? ' — a good direction.' : j.cls==='bad'&&j.dir ? ' — the less favourable direction, worth keeping an eye on.' : '.';
    out.push(`Over ${RANGE_WORDS[range]||'this period'} it ${verb}${tone}`);
  }
  // 2. last 30 days vs before and vs a year ago
  const r30=windowAvg(allPts,endT,30), p30=windowAvg(allPts,endT-30*DAY,30), y30=windowAvg(allPts,endT-365*DAY,30);
  if (r30!=null) {
    let s=`Your last 30 days averaged <b>${F(r30,dec)}${unit}${per}</b>`;
    const parts=[]; if (p30!=null) parts.push(cmpWord(r30,p30,dec,unit,'the month before',F)); if (y30!=null) parts.push(cmpWord(r30,y30,dec,unit,'the same time last year',F));
    out.push(s + (parts.length ? ` — ${parts.join(', and ')}.` : '.'));
  }
  // 3. this week vs your normal range
  const base=allPts.filter(p=>p.t>endT-90*DAY && p.t<=endT-7*DAY).map(p=>p.v), wk=windowAvg(allPts,endT,7);
  if (base.length>=20 && wk!=null) {
    const m=mean(base), s=sd(base);
    if (s>0 && Math.abs(wk-m) > s) {
      const hi=wk>m, good = meta.better==='up' ? hi : meta.better==='down' ? !hi : null;
      out.push(`This past week (${F(wk,dec)}${unit}) is <b>${hi?'above':'below'} your usual range</b> of ${F(m-s,dec)}–${F(m+s,dec)}${unit}${good===true?', in a good way.':good===false?'. One week isn’t a trend, but watch whether it continues.':'.'}`);
    } else out.push(`This past week (${F(wk,dec)}${unit}) is within your usual range.`);
  }
  // 4. personal best 30-day stretch
  if ((meta.better==='up'||meta.better==='down') && allPts.length>60) {
    let best=null; const step=Math.max(1,Math.floor(allPts.length/400));
    for (let i=0;i<allPts.length;i+=step){ const a=windowAvg(allPts,allPts[i].t,30); if(a==null) continue; if(!best||(meta.better==='up'?a>best.v:a<best.v)) best={v:a,t:allPts[i].t}; }
    if (best) { const near = r30!=null && Math.abs(r30-best.v) <= Math.max(Math.abs(best.v)*0.03, dec?0.1:1);
      out.push(`Your best 30-day stretch was <b>${F(best.v,dec)}${unit}</b> (around ${monthName(best.t)})${near?' — you’re right at that level now.':'.'}`); }
  }
  if (Array.isArray(meta.better) && r30!=null) {
    const [lo,hi]=meta.better, nights=allPts.filter(p=>p.t>endT-30*DAY), inR=nights.filter(p=>p.v>=lo&&p.v<=hi).length;
    out.push(`${inR} of your last ${nights.length} nights were in the ${lo}–${hi}${unit} range.`);
  }
  const short = r30==null ? '' : `Last 30 days ${F(r30,dec)}${unit}${per}` + (p30!=null ? ` · ${r30-p30>=0?'+':'−'}${F(Math.abs(r30-p30),dec)} vs month before` : '');
  return {j, short, html: out.map(s=>`<p>${s}</p>`).join('') + (meta.about?`<p class="about">${meta.about}</p>`:'')};
}

  $('#dlgBody').innerHTML=`<h2 style="font-size:18px">${esc(a.name||label(a.type))}</h2><dl>${f.filter(r=>r[1]!=null&&r[1]!=='–').map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>
   <p>${a.fit?`<a href="activities/fit/${a.id}.zip" download>Original FIT file</a> · `:''}${a.gpx?`<a href="activities/gpx/${a.id}.gpx" download>GPX</a> · `:''}${a.lat?`<a href="https://www.openstreetmap.org/?mlat=${a.lat}&mlon=${a.lon}#map=13/${a.lat}/${a.lon}" target="_blank">Start on map</a> · `:''}<a href="https://connect.garmin.com/modern/activity/${a.id}" target="_blank">Open in Garmin Connect</a></p>`;
  // compare with your usual for this type (previous 90 days, excluding this one)
  const t0=+new Date(a.start.slice(0,10)), peers=actRows(a.type).filter(r=>r.id!==a.id && +new Date(r.d)<=t0 && +new Date(r.d)>t0-90*DAY);
  const me=actRows(a.type).find(r=>r.id===a.id)||{}, run=isRunT(a.type), swim=isSwimT(a.type);
  const cmpDefs=[['Distance','km',v=>fmt(v,2)+' km','neutral'],['Duration','min',durFmt,'neutral'],
    run?['Pace','pace',v=>mmss(v)+' /km','down']:swim?['Pace','pace100',v=>mmss(v)+' /100m','down']:['Speed','kmh',v=>fmt(v,1)+' km/h','up'],
    ['Avg heart rate','avgHr',v=>fmt(v)+' bpm','neutral'],['Efficiency','eff',v=>fmt(v,2)+' m/beat','up'],['Training effect','te',v=>fmt(v,1),'neutral'],['Elevation','elev',v=>fmt(v)+' m','neutral']];
  const cmpRows=cmpDefs.map(([l,k,f,b])=>{ const mv=me[k], pv=peers.map(p=>p[k]).filter(v=>v!=null); if(mv==null||pv.length<3) return '';
    const u=mean(pv), d=mv-u, rel=Math.abs(d)/(Math.abs(u)||1);
    const tone = rel<0.03 ? '<span class="mut">typical</span>' : b==='neutral' ? `<span class="mut">${d>0?'higher':'lower'}</span>` :
      ((d>0)===(b==='up')) ? '<span class="chip good">better</span>' : '<span class="chip bad">below usual</span>';
    return `<tr><td>${l}</td><td class="n">${f(mv)}</td><td class="n">${f(u)}</td><td class="n">${tone}</td></tr>`; }).join('');
  const extra = (cmpRows ? `<h3 style="font-size:15px;margin:16px 0 4px">Compared with your usual</h3><p class="tline" style="margin:0 0 4px">Your average ${label(a.type).toLowerCase()} over the 90 days before this one (${peers.length} activities).</p>
      <table><thead><tr><th></th><th class="n">This</th><th class="n">Usual</th><th class="n"></th></tr></thead><tbody>${cmpRows}</tbody></table>` : '')
    + (a.z && a.z.some(s=>s) ? `<h3 style="font-size:15px;margin:16px 0 4px">Heart rate zones</h3>${zonesHTML(a.z)}` : '')
    + ((a.tl||a.teLabel) ? `<p class="tline" style="margin:12px 0 0">${a.teLabel?'Primary benefit: <b>'+esc(label(String(a.teLabel).toLowerCase()))+'</b>. ':''}${a.tl?'Training load '+fmt(a.tl)+'.':''}</p>` : '');
  $('#dlgBody').insertAdjacentHTML('beforeend', extra);
  $('#dlg').showModal();
}
// ---- exports --------------------------------------------------------------
const RANGE_TAG = () => ({30:'30d',90:'90d',365:'1y',0:'all'})[RANGE] || RANGE+'d';
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function saveFile(name, text, mime){
  const u=URL.createObjectURL(new Blob([text],{type:mime})); const l=document.createElement('a');
  l.href=u; l.download=name; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000);
}
function toCSV(rows, cols){ // cols: [[header, key | fn]]
  const q=v=>v==null?'':/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v;
  const get=(r,c)=>typeof c==='function'?c(r):r[c];
  const used=cols.filter(([,c])=>rows.some(r=>get(r,c)!=null&&get(r,c)!==''));
  return '﻿'+[used.map(c=>q(c[0])).join(','),...rows.map(r=>used.map(([,c])=>q(get(r,c))).join(','))].join('\r\n');
}
function exportCSV(what, rows, cols, allTime){
  if(!rows.length){ alert('Nothing to export in this time range.'); return; }
  saveFile(`garmin_${what}_${allTime?'all':RANGE_TAG()}_${today()}.csv`, toCSV(rows, cols), 'text/csv;charset=utf-8');
}
const hmsCol = k => r => r[k] ? hms(r[k]) : null;
const ACT_COLS=[['Activity ID','id'],['Start (local)','start'],['Name','name'],['Type',r=>label(r.type)],['Distance km','km'],['Duration',hmsCol('sec')],['Duration s','sec'],['Moving time',hmsCol('movSec')],
  ['Pace / speed',r=>r.km&&r.speed?pace(r):null],['Avg speed m/s','speed'],['Avg HR','avgHr'],['Max HR','maxHr'],['Elevation gain m','elev'],['Calories','kcal'],['Cadence','cadence'],['Avg power W','power'],
  ['Aerobic TE','aerobicTE'],['Anaerobic TE','anaerobicTE'],['VO2 max','vo2'],['Steps','steps'],['Location','loc'],['Start lat','lat'],['Start lon','lon'],['Notes','desc']];
const HEALTH_COLS=[['Date','d'],['Steps','steps'],['Step goal','stepGoal'],['Distance km','km'],['Total kcal','kcal'],['Active kcal','activeKcal'],['Resting HR','rhr'],['Max HR','maxHr'],
  ['Avg stress','stress'],['Body Battery high','bbHigh'],['Body Battery low','bbLow'],['Floors','floors'],['Intensity minutes','intensity'],['Overnight HRV ms','hrv'],['Training readiness','readiness'],
  ['VO2 max','vo2'],['SpO2 %','spo2'],['Waking respiration brpm','resp'],['Weight kg','kg']];
const SLEEP_COLS=[['Date','d'],['Total sleep h','sleepH'],['Deep h','deepH'],['Light h','lightH'],['REM h','remH'],['Awake h','awakeH'],['Sleep score','sleepScore']];
const WEIGHT_COLS=[['Date','d'],['Weight kg','kg'],['BMI','bmi'],['Body fat %','fat'],['Muscle mass kg','muscleKg']];
function byTypeRows(acts){
  const by={}; acts.forEach(a=>{const t=by[a.type]||(by[a.type]={type:a.type,n:0,km:0,sec:0,elev:0,kcal:0}); t.n++; t.km+=a.km||0; t.sec+=a.sec||0; t.elev+=a.elev||0; t.kcal+=a.kcal||0;});
  return Object.values(by).sort((a,b)=>b.n-a.n);
}
function weeklyRows(acts){
  const wk={}; acts.forEach(a=>{ if(!a.start) return; const d=new Date(a.start.slice(0,10)); d.setDate(d.getDate()-((d.getDay()+6)%7)); const k=d.toISOString().slice(0,10);
    const w=wk[k]||(wk[k]={d:k,n:0,km:0,sec:0,elev:0,kcal:0}); w.n++; w.km+=a.km||0; w.sec+=a.sec||0; w.elev+=a.elev||0; w.kcal+=a.kcal||0; });
  return Object.values(wk).sort((a,b)=>a.d<b.d?-1:1);
}
const SUM_COLS=[['Activities','n'],['Distance km',r=>+r.km.toFixed(2)],['Time h',r=>+(r.sec/3600).toFixed(2)],['Elevation m',r=>Math.round(r.elev)],['Calories',r=>Math.round(r.kcal)]];
const sleepDays = () => inRange(G.days).filter(d=>d.sleepH);
const EXPORTS = {
  activities: () => exportCSV('activities', currentActs(), ACT_COLS),
  bytype:     () => exportCSV('activity_types', byTypeRows(inRange(G.activities)), [['Type',r=>label(r.type)],...SUM_COLS]),
  weekly:     () => exportCSV('weekly_totals', weeklyRows(inRange(G.activities)), [['Week starting','d'],...SUM_COLS]),
  health:     () => exportCSV('daily_health', inRange(G.days).filter(d=>Object.keys(d).length>1), HEALTH_COLS),
  weights:    () => exportCSV('weigh_ins', inRange(G.weights), WEIGHT_COLS),
  sleep:      () => exportCSV('sleep', sleepDays(), SLEEP_COLS),
  records:    () => exportCSV('longest_efforts', bestRows(), [['Type',r=>label(r.type)],['Activities','n'],['Longest distance km',r=>r.l&&r.l.km],['Longest distance date',r=>r.l&&r.l.start],['Longest time',r=>r.d&&hms(r.d.sec)],['Longest time date',r=>r.d&&r.d.start],['Most climbing m',r=>r.e&&r.e.elev],['Most climbing date',r=>r.e&&r.e.start]], true),
  allActs:    () => exportCSV('activities', G.activities, ACT_COLS, true),
  allDays:    () => exportCSV('daily_health_and_sleep', G.days.filter(d=>Object.keys(d).length>1), [...HEALTH_COLS, ...SLEEP_COLS.slice(1)], true),
  allWeights: () => exportCSV('weigh_ins', G.weights, WEIGHT_COLS, true),
  json:       () => saveFile(`garmin_all_data_${today()}.json`, JSON.stringify(G, null, 1), 'application/json'),
};
const expBar = btns => `<div class="exp">${btns.map(([k,l])=>`<button class="dl" onclick="EXPORTS.${k}()">${l}</button>`).join('')}</div>`;
function bestRows(){
  const A=G.activities, best=(t,k)=>A.filter(a=>a.type===t&&a[k]).sort((a,b)=>b[k]-a[k])[0];
  return [...new Set(A.map(a=>a.type))].map(t=>({type:t, n:A.filter(a=>a.type===t).length, l:best(t,'km'), d:best(t,'sec'), e:best(t,'elev')})).sort((a,b)=>b.n-a.n);
}
function more(){
  const el=$('#more');
  const rows=bestRows().map(r=>`<tr><td>${label(r.type)}</td><td class="n">${r.l?fmt(r.l.km,1)+' km':'–'}</td><td class="n">${r.d?hms(r.d.sec):'–'}</td><td class="n">${r.e?fmt(r.e.elev)+' m':'–'}</td><td class="n">${r.n}</td></tr>`).join('');
  el.innerHTML=`<div class="card"><h2>Download all my data</h2><p class="mut" style="margin-top:0">Everything, all time. CSV files open in Excel, Google Sheets or Numbers.</p>
   ${expBar([['allActs','All activities CSV'],['allDays','All daily health & sleep CSV'],['allWeights','All weigh-ins CSV'],['records','Longest efforts CSV'],['json','Everything (JSON)']])}</div>
  <div class="card"><h2>Longest efforts (all time)</h2><div class="tw"><table><thead><tr><th>Type</th><th class="n">Longest distance</th><th class="n">Longest time</th><th class="n">Most climbing</th><th class="n">Total count</th></tr></thead><tbody>${rows||'<tr><td colspan=5 class="mut">No activities</td></tr>'}</tbody></table></div></div>
  <div class="card"><h2>Devices</h2>${G.devices.length?'<table><thead><tr><th>Device</th><th>Firmware</th></tr></thead><tbody>'+G.devices.map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(d.fw||'')}</td></tr>`).join('')+'</tbody></table>':'<p class="mut">None saved.</p>'}</div>
  <div class="card"><h2>Sync</h2><p class="mut">Last synced ${G.generated?new Date(G.generated).toLocaleString():'–'}. ${G.activities.length} activities, ${G.days.length} days, ${G.weights.length} weigh-ins.${G.meta&&G.meta.complete===false?' Older history is still downloading.':''}</p>
   <div class="links">${REPO?`<a href="${REPO}/actions/workflows/sync.yml" target="_blank">Sync now / enter verification code</a><a href="${REPO}/actions" target="_blank">Sync history</a>`:''}</div>
   <button class="btn" onclick="lockNow()">Lock &amp; forget passphrase on this device</button></div>
  <div class="card"><h2>Install as an app</h2>${installEvt?'<p class="mut" style="margin-top:0">Adds Garmin Dashboard to your home screen and app drawer. It opens full screen and works offline with your last sync.</p><button class="btn" onclick="installApp()">Install app</button>':
   window.matchMedia('(display-mode: standalone)').matches?'<p class="mut" style="margin:0">✓ Installed. It also works offline, showing your last sync.</p>':
   '<p class="mut" style="margin:0">Android (Chrome): tap ⋮ → <b>Install app</b> or <b>Add to Home screen</b>.<br>iPhone (Safari): tap Share → <b>Add to Home Screen</b>.</p>'}</div>`;
}
const RENDER={overview,health,sleep,activities,more};
$('#trend').addEventListener('close', ()=>{ TR=null; tip.style.display='none'; });
let TAB='overview';
function show(t){ TAB=t; document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t)); document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===t)); RENDER[t](); }
$('#tabs').onclick=e=>{ if(e.target.dataset.t) show(e.target.dataset.t); };
$('#range').onclick=e=>{ if(e.target.dataset.d==null) return; RANGE=+e.target.dataset.d; document.querySelectorAll('#range button').forEach(b=>b.classList.toggle('on',b===e.target)); show(TAB); };
// ---- app install / offline -------------------------------------------------
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (TAB==='more' && G) more(); });
window.addEventListener('appinstalled', () => { installEvt = null; if (TAB==='more' && G) more(); });
async function installApp(){ if(!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; if (G) more(); }
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
function startApp(){
  $('#title').textContent = G.name ? G.name.split(' ')[0]+"'s Garmin" : 'Garmin Dashboard';
  const span = G.days.length ? `${G.days[0].d} → ${G.days[G.days.length-1].d}` : '';
  $('#sub').textContent = `${G.activities.length} activities · ${G.days.length} days ${span}`;
  $('#lock').remove(); show('overview');
}
// ---- decryption (matches garmin_sync.py) -----------------------------------
const REPO = location.hostname.endsWith('github.io') ? `https://github.com/${location.hostname.split('.')[0]}/${location.pathname.split('/')[1]||location.hostname}` : '';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptData(env, pass){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(env.salt), iterations:env.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(env.iv)}, key, b64(env.ct));
  return JSON.parse(await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
}
let ENV = null;
async function loadEnv(){
  if (ENV) return ENV;
  const r = await fetch('data.enc.json?t=' + Date.now(), {cache:'no-store'});
  if (!r.ok) throw new Error('nodata');
  return ENV = await r.json();
}
const store = { get(){ try{return localStorage.getItem('gd-pass');}catch(e){return null;} }, set(v){ try{localStorage.setItem('gd-pass',v);}catch(e){} }, del(){ try{localStorage.removeItem('gd-pass');}catch(e){} } };
function lockNow(){ store.del(); location.reload(); }
async function unlock(pass, remember){
  const err = $('#lockErr'), btn = $('#unlockBtn');
  err.textContent=''; btn.disabled=true; btn.textContent='Unlocking…';
  try {
    const env = await loadEnv();
    try { G = await decryptData(env, pass); }
    catch(e){ store.del(); throw new Error('Wrong passphrase.'); }
    if (remember) store.set(pass);
    startApp();
  } catch(e) {
    err.textContent = e.message==='nodata' ? 'No data yet. The first sync hasn’t finished — check the Actions tab in your GitHub repo.' : e.message;
    btn.disabled=false; btn.textContent='Unlock';
  }
}
$('#lockForm').onsubmit = e => { e.preventDefault(); unlock($('#pass').value, $('#remember').checked); };
if (!window.crypto || !crypto.subtle || !window.DecompressionStream) $('#lockErr').textContent='This browser is too old to open encrypted data. Please update it.';
else { const saved = store.get(); if (saved) unlock(saved, true); }
</script>
